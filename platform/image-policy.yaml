apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: verify-company-website
spec:
  mode: enforce
  images:
    - glob: ghcr.io/itsx25-chas/company-website@sha256:*
  authorities:
    - name: github-main-deploy
      keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/ITSX25-Chas/company-website/.github/workflows/deploy.yml@refs/heads/main
      ctlog:
        url: https://rekor.sigstore.dev
